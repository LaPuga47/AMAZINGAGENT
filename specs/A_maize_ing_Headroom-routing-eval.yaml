      - utterance: "Are there competing grants for Kenya Trees in 2027?"
    scorers:
      - name: topic_sequence_match
        expected: competing_grants
  - inputs:
      - utterance: "Which Opportunities are targeting Kenya Trees in 2027?"
    scorers:
      - name: topic_sequence_match
        expected: competing_grants
  - inputs:
      - utterance: "Should I raise money for Kenya Trees in 2027?"
      - utterance: "Show me the competing grants"
    scorers:
      - name: topic_sequence_match
        expected: headroom_analysis,competing_grants
